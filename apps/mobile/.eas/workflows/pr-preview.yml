name: PR preview
defaults:
  tools:
    node: '24.19.0'
    bun: '1.4.4'
on:
  pull_request:
    branches: [main]
jobs:
  preview:
    type: update
    environment: preview
    params:
      branch: pr-${{ github.event.pull_request.number }}
      platform: all
  comment:
    needs: [preview]
    type: github-comment
