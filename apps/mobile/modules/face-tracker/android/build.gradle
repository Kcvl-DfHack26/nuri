plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.facetracker'
version = '0.1.0'

android {
  namespace "expo.modules.facetracker"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    // Apps that shrink their release builds keep what MediaPipe needs (see proguard-rules.pro).
    consumerProguardFiles 'proguard-rules.pro'
  }
  // iOS and Android share one copy of the model in the module's assets/ folder.
  sourceSets {
    main {
      assets.srcDirs += ['../assets']
    }
  }
  // The model is already compressed; keep it stored so MediaPipe can map it.
  androidResources {
    noCompress += 'task'
  }
}

dependencies {
  implementation 'com.google.mediapipe:tasks-vision:1.2.2'
  def cameraxVersion = '1.6.2'
  implementation "androidx.camera:camera-camera2:${cameraxVersion}"
  implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
  implementation "androidx.camera:camera-view:${cameraxVersion}"
}
