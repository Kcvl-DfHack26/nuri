    <style>
      :root {
        --paper: #fffbfd;
        --ink: #43304b;
        --muted: #6f5d76;
        --rule: #e4cdd9;
        --rose: #b52f63;
        --pink: #ffe6ee;
        --data: #e2efff;
      }
      body {
        margin: 0;
        background: var(--paper);
      }
      .diagram-container {
        overflow-x: auto;
      }
      svg {
        display: block;
        width: 100%;
        min-width: 1440px;
      }
      text {
        fill: var(--ink);
        font-family: 'Zen Maru Gothic', 'Hiragino Sans', 'Yu Gothic', sans-serif;
      }
      .heading {
        font-size: 52px;
        font-weight: 900;
      }
      .lede {
        font-size: 26px;
        font-weight: 500;
        fill: var(--muted);
      }
      .name {
        font-size: 25px;
        font-weight: 700;
      }
      .compact {
        font-size: 21px;
        font-weight: 700;
      }
      .detail {
        font-size: 21px;
        font-weight: 500;
        fill: var(--muted);
      }
      .micro {
        font-size: 19px;
        font-weight: 500;
        fill: var(--muted);
      }
      .eyebrow {
        font-size: 23px;
        font-weight: 700;
      }
      .accent {
        fill: var(--rose);
      }
      .rule {
        stroke: var(--rule);
        stroke-width: 2;
      }
      .card {
        fill: #fff;
        stroke: var(--rule);
        stroke-width: 2;
      }
      .zone {
        fill: #fff6fa;
        stroke: var(--rule);
        stroke-width: 2;
      }
      .zone-cloud {
        fill: #f7f9fe;
        stroke: #cbd8ea;
      }
      .zone-inner {
        fill: var(--paper);
        stroke: #cbd8ea;
        stroke-dasharray: 7 5;
      }
      .external {
        fill: #f3edff;
        stroke: #ded2f0;
      }
      .storage {
        fill: var(--data);
        stroke: #c8dceb;
      }
      .focal {
        fill: var(--pink);
        stroke: var(--rose);
      }
      .conditional-card {
        stroke-dasharray: 6 5;
      }
      .edge {
        fill: none;
        stroke: var(--rose);
        stroke-width: 2.6;
      }
      .internal {
        stroke: var(--muted);
      }
      .conditional {
        stroke: var(--muted);
        stroke-dasharray: 7 5;
      }
      .bridge {
        fill: none;
        stroke: var(--paper);
        stroke-width: 9;
      }
      .edge-label {
        font-size: 19px;
        font-weight: 700;
        fill: var(--muted);
      }
    </style>
