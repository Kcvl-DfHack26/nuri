x-runtime: &runtime
  image: ${COMPOSE_PROJECT_NAME}-dev
  build:
    context: .
    dockerfile: .devcontainer/Dockerfile
  init: true
  user: node
  working_dir: ${WORKTREE_ROOT:?Run sh scripts/worktree-init.sh first}
  environment: &environment
    NODE_ENV: development
    DEV_API_ORIGIN: https://api.${COMPOSE_PROJECT_NAME}.localhost
    DEV_METRO_ORIGIN: https://metro.${COMPOSE_PROJECT_NAME}.localhost
    BUN_INSTALL_CACHE_DIR: ${WORKTREE_ROOT}/node_modules/.cache/bun
  volumes:
    - type: bind
      source: ${WORKTREE_ROOT}
      target: ${WORKTREE_ROOT}
    - type: bind
      source: ${WORKTREE_GIT_COMMON_DIR:?Run sh scripts/worktree-init.sh first}
      target: ${WORKTREE_GIT_COMMON_DIR}
    - root-modules:${WORKTREE_ROOT}/node_modules
    - mobile-modules:${WORKTREE_ROOT}/apps/mobile/node_modules
    - api-modules:${WORKTREE_ROOT}/apps/api/node_modules
    - emulate-modules:${WORKTREE_ROOT}/apps/emulate/node_modules
    - shared-modules:${WORKTREE_ROOT}/packages/shared/node_modules
    - gcloud-config:/home/node/.config/gcloud
    - expo-config:/home/node/.expo

x-local-gcp: &local-gcp
  <<: *environment
  FLOCI_GCP_URL: &floci-url http://floci:4588
  STORAGE_EMULATOR_HOST: *floci-url
  GCS_BUCKET: ${COMPOSE_PROJECT_NAME}
  GOOGLE_CLOUD_PROJECT: ${COMPOSE_PROJECT_NAME}

services:
  setup:
    <<: *runtime
    user: root
    command:
      - sh
      - -ec
      - |
        chown -R node:node node_modules apps/mobile/node_modules apps/api/node_modules apps/emulate/node_modules packages/shared/node_modules /home/node/.expo /home/node/.config/gcloud
        exec sudo -u node -H sh -ec 'bun install --frozen-lockfile --ignore-scripts && bun run setup'
  migrate:
    <<: *runtime
    environment: *local-gcp
    entrypoint: [sh, scripts/with-local-database.sh, --init]
    command:
      - sh
      - -ec
      - |
        bun run --cwd apps/api db:migrate
        exec bun run --cwd apps/api storage:init
    depends_on:
      setup:
        condition: service_completed_successfully
      floci:
        condition: service_healthy
  api:
    <<: *runtime
    entrypoint: [sh, scripts/with-local-database.sh]
    environment:
      <<: *local-gcp
      PORT: '8080'
      AUTH_EMULATE: 'true'
      GOOGLE_EMULATOR_URL: http://google:4002
      GOOGLE_EMULATOR_PUBLIC_URL: https://google.${COMPOSE_PROJECT_NAME}.localhost
      RESEND_API_URL: http://mail:4005
      PASSKEY_RP_ID: ${COMPOSE_PROJECT_NAME}.localhost
      PASSKEY_ORIGINS: https://metro.${COMPOSE_PROJECT_NAME}.localhost
    command: bun run --cwd apps/api dev
    stop_signal: SIGINT
    ports: ['127.0.0.1:8080:8080']
    labels:
      portless.ports: '8080'
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:8080/ready']
      interval: 3s
      timeout: 3s
      retries: 40
    depends_on:
      migrate:
        condition: service_completed_successfully
      google:
        condition: service_started
      mail:
        condition: service_started
  google:
    <<: *runtime
    environment:
      <<: *environment
      EMULATE_SERVICE: google
      EMULATE_HOST: 0.0.0.0
      EMULATE_PUBLIC_URL: https://google.${COMPOSE_PROJECT_NAME}.localhost
      PORT: '4002'
    command: bun run --cwd apps/emulate dev
    ports: ['127.0.0.1:4002:4002']
    labels: { portless.ports: '4002' }
    depends_on:
      setup:
        condition: service_completed_successfully
  mail:
    <<: *runtime
    environment:
      <<: *environment
      EMULATE_SERVICE: resend
      EMULATE_HOST: 0.0.0.0
      EMULATE_PUBLIC_URL: https://mail.${COMPOSE_PROJECT_NAME}.localhost
      PORT: '4005'
    command: bun run --cwd apps/emulate dev
    ports: ['127.0.0.1:4005:4005']
    labels: { portless.ports: '4005' }
    depends_on:
      setup:
        condition: service_completed_successfully
  metro:
    <<: *runtime
    tty: true
    stdin_open: true
    environment:
      <<: *environment
      EXPO_PACKAGER_PROXY_URL: https://metro.${COMPOSE_PROJECT_NAME}.localhost
    command: bun run --cwd apps/mobile dev
    stop_signal: SIGINT
    ports: ['127.0.0.1:8081:8081']
    labels:
      portless.ports: '8081'
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:8081/status']
      interval: 3s
      timeout: 3s
      retries: 40
    depends_on:
      setup:
        condition: service_completed_successfully
  workspace:
    <<: *runtime
    environment: *local-gcp
    image: ${COMPOSE_PROJECT_NAME}-workspace
    profiles: [editor]
    command: sleep infinity
    depends_on:
      migrate:
        condition: service_completed_successfully
  api-tunnel:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.10.7
    command: tunnel --no-autoupdate --protocol http2 --url http://api:8080
    depends_on:
      api:
        condition: service_healthy
  floci:
    image: floci/floci-gcp:0.12.0
    environment:
      FLOCI_GCP_HOSTNAME: floci
      FLOCI_GCP_BASE_URL: *floci-url
      FLOCI_GCP_DEFAULT_PROJECT_ID: ${COMPOSE_PROJECT_NAME}
      FLOCI_GCP_DOCKER_RESOURCE_NAMESPACE: ${COMPOSE_PROJECT_NAME}
      FLOCI_GCP_SERVICES_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME}_default
      FLOCI_GCP_SERVICES_CLOUDSQL_POSTGRES17_IMAGE: postgres:17.7-bookworm
      FLOCI_GCP_SERVICES_CLOUDRUN_MOCK: 'true'
      FLOCI_GCP_SERVICES_GKE_ENABLED: 'false'
      FLOCI_GCP_SERVICES_KAFKA_ENABLED: 'false'
      FLOCI_GCP_SERVICES_BIGQUERY_MOCK: 'true'
      FLOCI_GCP_SERVICES_COMPUTE_RECONCILE_CONTAINERS_ON_STARTUP: 'false'
      FLOCI_GCP_STORAGE_MODE: persistent
    volumes:
      - floci-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  root-modules:
  mobile-modules:
  api-modules:
  emulate-modules:
  shared-modules:
  gcloud-config:
  expo-config:
  floci-data:
