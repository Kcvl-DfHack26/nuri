name: ${COMPOSE_PROJECT_NAME:?Run sh scripts/worktree-init.sh first}
services:
  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    init: true
    user: node
    working_dir: ${WORKTREE_ROOT:?Run sh scripts/worktree-init.sh first}
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql://expo-hono-opentofu-starter:starter@postgres:5432/expo-hono-opentofu-starter
      NODE_ENV: development
      STARTER_CONTAINER: '1'
      PORT: '8080'
    ports:
      - '127.0.0.1::8080'
      - '127.0.0.1::8081'
    volumes:
      - type: bind
        source: ${WORKTREE_ROOT}
        target: ${WORKTREE_ROOT}
      - type: bind
        source: ${WORKTREE_GIT_COMMON_DIR:?Run sh scripts/worktree-init.sh first}
        target: ${WORKTREE_GIT_COMMON_DIR}
      - root-modules:${WORKTREE_ROOT}/node_modules
      - mobile-modules:${WORKTREE_ROOT}/apps/mobile/node_modules
      - api-modules:${WORKTREE_ROOT}/apps/api/node_modules
      - shared-modules:${WORKTREE_ROOT}/packages/shared/node_modules
      - bun-cache:/home/node/.bun
      - gcloud-config:/home/node/.config/gcloud
      - expo-config:/home/node/.expo
    depends_on:
      postgres:
        condition: service_healthy
  api-tunnel:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.10.7
    command: tunnel --no-autoupdate --protocol http2 --url http://workspace:8080
    depends_on: [workspace]
  postgres:
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_USER: expo-hono-opentofu-starter
      POSTGRES_PASSWORD: starter
      POSTGRES_DB: expo-hono-opentofu-starter
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U expo-hono-opentofu-starter -d expo-hono-opentofu-starter']
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  root-modules:
  mobile-modules:
  api-modules:
  shared-modules:
  bun-cache:
  gcloud-config:
  expo-config:
  postgres-data:
