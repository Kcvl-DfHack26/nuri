worker_processes 1;
pid /tmp/nuri-preview-nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
  access_log off;
  client_body_temp_path /tmp/nuri-client;
  proxy_temp_path /tmp/nuri-proxy;
  fastcgi_temp_path /tmp/nuri-fastcgi;
  uwsgi_temp_path /tmp/nuri-uwsgi;
  scgi_temp_path /tmp/nuri-scgi;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_read_timeout 180s;
  proxy_buffering off;

  map "$http_expo_platform:$arg_platform" $root_upstream {
    default 127.0.0.1:8081;
    ~(^|:)(android|ios)(:|$) 127.0.0.1:8082;
  }

  map "$arg_unstable_path:$arg_platform" $asset_upstream {
    default 127.0.0.1:8081;
    ~^.+: 127.0.0.1:8082;
    ~:(android|ios)$ 127.0.0.1:8082;
  }

  server {
    listen 8080;

    location = / { proxy_pass http://$root_upstream; }

    location = /expo-go/qr.svg {
      alias /tmp/nuri-preview-qr.svg;
      default_type image/svg+xml;
      add_header Cache-Control "public, max-age=86400";
    }

    location ~ \.bundle$ {
      limit_except GET { deny all; }
      proxy_pass http://127.0.0.1:8082;
    }

    location = /api/me/profile/photo {
      client_max_body_size 6m;
      proxy_pass http://127.0.0.1:8081;
    }

    location = /assets { proxy_pass http://$asset_upstream; }
    location /assets/ { proxy_pass http://$asset_upstream; }
    location / { proxy_pass http://127.0.0.1:8081; }
  }
}
