name: PR Preview
on:
  issue_comment:
    types: [edited]
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
    branches: [main]
  schedule:
    - cron: '41 17 * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: Open pull request number
        type: string
        required: true
      operation:
        description: Publish the preview or create its status comment only
        type: choice
        options: [publish, comment]
        default: publish
permissions:
  contents: read
concurrency:
  group: nuri-preview-cloud
  queue: max
jobs:
  request:
    name: Prepare Preview Comment
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'comment') ||
      (github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository && github.event.sender.type == 'User') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.sender.type == 'User' &&
      contains(github.event.comment.body, '<!-- expo-hono-opentofu-starter-preview-request -->'))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      pr: ${{ steps.request.outputs.pr }}
      sha: ${{ steps.request.outputs.sha }}
      comment: ${{ steps.request.outputs.comment }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Prepare Preview Comment
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          REQUEST_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_OPERATION: ${{ inputs.operation }}
          PREVIEW_CAN_PUBLISH: ${{ github.ref == 'refs/heads/main' && vars.PREVIEW_GCP_ENABLED == 'true' }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_BEFORE: ${{ github.event.changes.body.from }}
        run: bun .github/scripts/preview/request.ts

  inspect:
    name: Inspect Preview State
    needs: request
    if: >-
      github.ref == 'refs/heads/main' && needs.request.outputs.pr != '' &&
      vars.PREVIEW_GCP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: preview
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      environment: ${{ steps.inspect.outputs.environment }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PREVIEW_WIF_PROVIDER }}
          service_account: ${{ vars.PREVIEW_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3.0.1
      - name: Select Preview Credentials
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_GCP_PROJECT_ID: ${{ vars.PREVIEW_GCP_PROJECT_ID }}
          PREVIEW_PR: ${{ needs.request.outputs.pr }}
          PREVIEW_SHA: ${{ needs.request.outputs.sha }}
        run: bun .github/scripts/preview/cloud.ts inspect "$PREVIEW_PR" "$PREVIEW_SHA"

  apply:
    name: Apply Preview Infrastructure
    needs: [request, inspect]
    if: >-
      needs.inspect.outputs.environment == 'preview' ||
      needs.inspect.outputs.environment == 'preview-create'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ needs.inspect.outputs.environment }}
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      tofu_log: ${{ steps.apply.outputs.tofu_log }}
      tofu_exit: ${{ steps.apply.outputs.tofu_exit }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PREVIEW_WIF_PROVIDER }}
          service_account: ${{ vars.PREVIEW_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3.0.1
      - name: Install Verified OpenTofu and Provider
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun .github/scripts/ci/prepare-opentofu.ts infra/preview-pr/.terraform.lock.hcl
      - name: Apply Preview Infrastructure
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_GCP_PROJECT_ID: ${{ vars.PREVIEW_GCP_PROJECT_ID }}
          PREVIEW_RUN_TAG_KEY: ${{ vars.PREVIEW_RUN_TAG_KEY }}
          PREVIEW_RUN_TAG_VALUE: ${{ vars.PREVIEW_RUN_TAG_VALUE }}
          PREVIEW_PR: ${{ needs.request.outputs.pr }}
          PREVIEW_SHA: ${{ needs.request.outputs.sha }}
        run: bun .github/scripts/preview/cloud.ts apply "$PREVIEW_PR" "$PREVIEW_SHA"

  publish:
    name: Publish Preview
    needs: [request, apply]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      origin: ${{ steps.preview.outputs.origin }}
      deployed_at: ${{ steps.preview.outputs.deployed_at }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      # ビルド手順は main のものを使い、PR のコードは Docker に渡す。
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.request.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: controller/.bun-version
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PREVIEW_WIF_PROVIDER }}
          service_account: ${{ vars.PREVIEW_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3.0.1
      - name: Publish and Verify Preview
        id: preview
        working-directory: controller
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_GCP_PROJECT_ID: ${{ vars.PREVIEW_GCP_PROJECT_ID }}
          PREVIEW_PR: ${{ needs.request.outputs.pr }}
          PREVIEW_SHA: ${{ needs.request.outputs.sha }}
        run: bun .github/scripts/preview/cloud.ts publish "$PREVIEW_PR" "$PREVIEW_SHA" "$GITHUB_WORKSPACE/source"

  cleanup:
    name: Clean Up Closed Previews
    if: >-
      github.ref == 'refs/heads/main' && vars.PREVIEW_GCP_ENABLED == 'true' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'pull_request_target' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      logs: ${{ steps.logs.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PREVIEW_WIF_PROVIDER }}
          service_account: ${{ vars.PREVIEW_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3.0.1
      - name: Install Verified OpenTofu and Provider
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun .github/scripts/ci/prepare-opentofu.ts infra/preview-pr/.terraform.lock.hcl
      - name: Delete Closed Preview Resources
        id: cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_GCP_PROJECT_ID: ${{ vars.PREVIEW_GCP_PROJECT_ID }}
          PREVIEW_RUN_TAG_KEY: ${{ vars.PREVIEW_RUN_TAG_KEY }}
          PREVIEW_RUN_TAG_VALUE: ${{ vars.PREVIEW_RUN_TAG_VALUE }}
          PREVIEW_PR: ${{ github.event.pull_request.number }}
          PREVIEW_CLEANUP_REPORTS: ${{ runner.temp }}/preview-cleanup.ndjson
        run: bun .github/scripts/preview/cloud.ts cleanup "$PREVIEW_PR"
      - uses: actions/upload-artifact@v7.0.2
        id: logs
        if: always() && steps.cleanup.outputs.has_reports == 'true'
        with:
          name: preview-cleanup-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preview-cleanup.ndjson
          retention-days: 1

  report-destroy:
    name: Report OpenTofu Destroy
    needs: cleanup
    if: always() && needs.cleanup.outputs.logs != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.cleanup.outputs.logs }}
          path: ${{ runner.temp }}/preview-cleanup
      - name: Post Destroy Logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun .github/scripts/preview/report-cleanup.ts "$RUNNER_TEMP/preview-cleanup/preview-cleanup.ndjson"

  report-apply:
    name: Report OpenTofu Apply
    needs: [request, apply]
    if: always() && needs.apply.outputs.tofu_exit != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Post Apply Log
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_PR: ${{ needs.request.outputs.pr }}
          TOFU_LOG: ${{ needs.apply.outputs.tofu_log }}
          TOFU_EXIT: ${{ needs.apply.outputs.tofu_exit }}
        run: bun .github/scripts/preview/report-operation.ts

  report:
    name: Report Preview Deployment
    needs: [request, inspect, apply, publish]
    if: always() && needs.request.outputs.comment != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # 配信対象のPRではなく、信頼済みのワークフローの版でコメントを作る。
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Update Preview Comment
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_PR: ${{ needs.request.outputs.pr }}
          PREVIEW_SHA: ${{ needs.request.outputs.sha }}
          PREVIEW_COMMENT: ${{ needs.request.outputs.comment }}
          PREVIEW_RESULT: ${{ (needs.inspect.result == 'failure' || needs.apply.result == 'failure') && 'failure' || needs.publish.result }}
          PREVIEW_ORIGIN: ${{ needs.publish.outputs.origin }}
          PREVIEW_DEPLOYED_AT: ${{ needs.publish.outputs.deployed_at }}
        run: bun .github/scripts/preview/report.ts
