name: Publish or clean up PR preview
on:
  issue_comment:
    types: [edited]
  pull_request_target:
    types: [closed]
    branches: [main]
  schedule:
    - cron: '41 17 * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: Open pull request number
        type: string
        required: true
      operation:
        description: Publish the preview or create its status comment only
        type: choice
        options: [publish, comment]
        default: publish
permissions:
  contents: read
concurrency:
  group: nuri-preview-cloud
  queue: max
jobs:
  request:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'comment') ||
      (github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.sender.type == 'User' &&
      contains(github.event.comment.body, '<!-- expo-hono-opentofu-starter-preview-request -->'))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      pr: ${{ steps.request.outputs.pr }}
      sha: ${{ steps.request.outputs.sha }}
      comment: ${{ steps.request.outputs.comment }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@v9.0.0
        id: request
        env:
          REQUEST_PR: ${{ inputs.pr }}
          PREVIEW_OPERATION: ${{ inputs.operation }}
          PREVIEW_CAN_PUBLISH: ${{ github.ref == 'refs/heads/main' && vars.PREVIEW_GCP_ENABLED == 'true' }}
        with:
          script: |
            const { assertPreviewTarget, parsePreviewRequest, previewMarker, previewSetupPendingMarker, previewSha, renderPreviewComment } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/preview-comment.ts`);
            const commentOnly = context.eventName === 'workflow_dispatch' && process.env.PREVIEW_OPERATION === 'comment';
            const canRequest = !commentOnly || process.env.PREVIEW_CAN_PUBLISH === 'true';
            const isComment = context.eventName === 'issue_comment';
            const payload = context.payload;
            const requestedSha = isComment ? parsePreviewRequest({ author: payload.comment.user.login, body: payload.comment.body, before: payload.changes?.body?.from }) : undefined;
            if (isComment && !requestedSha) return;
            const number = isComment ? String(payload.issue.number) : process.env.REQUEST_PR;
            if (!/^[1-9]\d{0,8}$/.test(number ?? '')) throw new Error('PR番号が不正です');
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({ ...context.repo, username: context.actor });
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: Number(number) });
            assertPreviewTarget({ actorType: payload.sender?.type, permission: permission.permission, repository: `${context.repo.owner}/${context.repo.repo}`, headRepository: pr.head.repo?.full_name, state: pr.state, sha: pr.head.sha, requestedSha });
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: pr.number });
            let comment = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(`${previewMarker}\n`));
            if (isComment && (!comment || comment.id !== payload.comment.id || comment.body !== payload.comment.body || previewSha(comment.body) !== pr.head.sha)) throw new Error('最新のpreviewコメントから実行してください');
            // A legacy comment can match the SHA and still need to be replaced with the table.
            const currentTable = comment?.body?.split('\n', 2)[1] === `<!-- nuri-preview-sha: ${pr.head.sha} -->`;
            const activateRequest = canRequest && comment?.body?.includes(previewSetupPendingMarker);
            if (commentOnly && currentTable && !activateRequest) return;
            const body = renderPreviewComment({
              sha: pr.head.sha,
              pullRequest: { number: pr.number, url: pr.html_url },
              canRequest,
              status: commentOnly ? undefined : '⏳ 配信中',
              runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            if (comment) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: comment.id, body });
            } else {
              ({ data: comment } = await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body }));
            }
            if (commentOnly) return;
            core.setOutput('pr', String(pr.number));
            core.setOutput('sha', pr.head.sha);
            core.setOutput('comment', String(comment.id));

  publish:
    needs: request
    if: >-
      github.ref == 'refs/heads/main' && inputs.operation != 'comment' &&
      needs.request.outputs.pr != '' && vars.PREVIEW_GCP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      origin: ${{ steps.preview.outputs.origin }}
      deployed_at: ${{ steps.preview.outputs.deployed_at }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      # This directory is only the Docker build context. Its code never runs on the host.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.request.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PREVIEW_WIF_PROVIDER }}
          service_account: ${{ vars.PREVIEW_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3.0.1
      - name: Publish and check the Cloud Run preview
        id: preview
        working-directory: controller
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_PR: ${{ needs.request.outputs.pr }}
          PREVIEW_SHA: ${{ needs.request.outputs.sha }}
        run: bash scripts/preview-cloud.sh publish "$PREVIEW_PR" "$PREVIEW_SHA" "$GITHUB_WORKSPACE/source"

  cleanup:
    if: >-
      github.ref == 'refs/heads/main' && vars.PREVIEW_GCP_ENABLED == 'true' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      logs: ${{ steps.logs.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PREVIEW_WIF_PROVIDER }}
          service_account: ${{ vars.PREVIEW_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3.0.1
      - name: Delete closed PR tags, revisions and images
        id: cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_PR: ${{ github.event.pull_request.number }}
          PREVIEW_CLEANUP_REPORTS: ${{ runner.temp }}/preview-cleanup.ndjson
        run: |
          result=0
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            bash scripts/preview-cloud.sh sweep || result=$?
          else
            bash scripts/preview-cloud.sh cleanup "$PREVIEW_PR" || result=$?
          fi
          if [[ -s "$PREVIEW_CLEANUP_REPORTS" ]]; then
            echo 'has_reports=true' >> "$GITHUB_OUTPUT"
          fi
          exit "$result"
      - uses: actions/upload-artifact@v7.0.2
        id: logs
        if: always() && steps.cleanup.outputs.has_reports == 'true'
        with:
          name: preview-cleanup-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preview-cleanup.ndjson
          retention-days: 1

  report-cleanup:
    name: Report preview cleanup on PRs
    needs: cleanup
    if: always() && needs.cleanup.outputs.logs != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.cleanup.outputs.logs }}
          path: ${{ runner.temp }}/preview-cleanup
      - uses: actions/github-script@v9.0.0
        with:
          script: |
            const { readFile } = await import('node:fs/promises');
            const reports = await readFile(`${process.env.RUNNER_TEMP}/preview-cleanup/preview-cleanup.ndjson`, 'utf8');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/attempts/${process.env.GITHUB_RUN_ATTEMPT}`;
            for (const line of reports.trimEnd().split('\n')) {
              const { pr, log, exitCode } = JSON.parse(line);
              const result = exitCode === 0 ? '✅ 削除完了' : `❌ 失敗（終了コード ${exitCode}）`;
              const excerpt = log.length > 58_000 ? `${log.slice(0, 58_000)}\n… 続きは Actions の実行ログを参照` : log.trimEnd();
              const body = ['### 🧹 Preview Cleanup', '', result, '', '```text', excerpt, '```', '', `[Actions の実行ログ](${runUrl})`].join('\n');
              try {
                await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body });
              } catch (error) {
                core.setFailed(`PR #${pr} の cleanup コメントを投稿できませんでした。${error.message}`);
              }
            }

  report:
    needs: [request, publish]
    if: always() && needs.request.outputs.comment != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Render from the trusted workflow revision, not from the published PR.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@v9.0.0
        env:
          PREVIEW_PR: ${{ needs.request.outputs.pr }}
          PREVIEW_SHA: ${{ needs.request.outputs.sha }}
          PREVIEW_COMMENT: ${{ needs.request.outputs.comment }}
          PREVIEW_RESULT: ${{ needs.publish.result }}
          PREVIEW_ORIGIN: ${{ needs.publish.outputs.origin }}
          PREVIEW_DEPLOYED_AT: ${{ needs.publish.outputs.deployed_at }}
        with:
          script: |
            const { previewSha, renderPreviewComment } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/preview-comment.ts`);
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: Number(process.env.PREVIEW_PR) });
            const { data: comment } = await github.rest.issues.getComment({ ...context.repo, comment_id: Number(process.env.PREVIEW_COMMENT) });
            if (pr.state !== 'open' || pr.head.sha !== process.env.PREVIEW_SHA || previewSha(comment.body) !== pr.head.sha) return;
            const success = process.env.PREVIEW_RESULT === 'success';
            const skipped = process.env.PREVIEW_RESULT === 'skipped';
            const status = success ? '✅ 完了' : skipped ? undefined : '❌ 失敗';
            const body = renderPreviewComment({ sha: pr.head.sha, pullRequest: { number: pr.number, url: pr.html_url }, status, canRequest: !skipped, runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`, deployment: success ? { origin: process.env.PREVIEW_ORIGIN, createdAt: process.env.PREVIEW_DEPLOYED_AT } : undefined });
            await github.rest.issues.updateComment({ ...context.repo, comment_id: comment.id, body });
