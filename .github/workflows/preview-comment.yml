name: PR Preview Comment
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches-ignore: [main]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: preview-comment-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  comment:
    name: Initialize Preview Comment
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # PRのコードを実行せず、mainのスクリプトでコメントを作る。
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      # mainへの取り込み前は、PRブランチのコメント専用実行を使う。
      - uses: oven-sh/setup-bun@v2
        if: hashFiles('.github/scripts/preview/initialize.ts') != ''
        with:
          bun-version-file: .bun-version
      - name: Install Preview Script Dependencies
        if: hashFiles('.github/scripts/preview/initialize.ts') != ''
        run: bun install --production --frozen-lockfile --ignore-scripts --filter './'
      - name: Update Preview Comment
        if: hashFiles('.github/scripts/preview/initialize.ts') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_CAN_PUBLISH: ${{ vars.PREVIEW_GCP_ENABLED == 'true' }}
        run: bun .github/scripts/preview/initialize.ts
