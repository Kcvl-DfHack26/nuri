name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: '1'
jobs:
  static-analysis:
    name: Static Analysis · 整形・lint・型検査・Fallow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - &setup-bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - &install
        name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Verify generated Uniwind types
        run: |
          bun run --bun --cwd apps/mobile styles:generate
          git diff --exit-code -- apps/mobile/uniwind-types.d.ts
      - name: Check formatting, lint, types and dead code
        run: bun run --bun --parallel format:check lint typecheck deadcode
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun run --bun commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  unit:
    name: Unit Test · Scripts・Hono API・Shared (Bun)
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - *setup-bun
      - *install
      - name: Run Bun unit tests
        run: bun run --bun turbo run test test:scripts --filter='!@starter/mobile' --log-order=stream

  mobile-unit:
    name: Unit Test · Expo UI (Jest, shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - *checkout
      - *setup-bun
      - *install
      - name: Run the Jest shard
        env:
          SHARD: ${{ matrix.shard }}/2
        run: bun run --bun --cwd apps/mobile test --shard="$SHARD"

  api-integration:
    name: Integration Test · Hono API と PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres: &postgres
        image: postgres:17.7-bookworm
        env:
          POSTGRES_USER: expo-hono-opentofu-starter
          POSTGRES_PASSWORD: starter
          POSTGRES_DB: expo-hono-opentofu-starter
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U expo-hono-opentofu-starter -d expo-hono-opentofu-starter"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - *checkout
      - *setup-bun
      - *install
      - name: Migrate the disposable database
        env:
          DATABASE_URL: postgresql://expo-hono-opentofu-starter:starter@localhost:5432/expo-hono-opentofu-starter
        run: bun run --cwd apps/api src/db/migrate.ts
      - name: Run PostgreSQL integration tests
        env:
          DATABASE_URL: postgresql://expo-hono-opentofu-starter:starter@localhost:5432/expo-hono-opentofu-starter
        run: bun run --cwd apps/api test:integration

  web-e2e:
    name: E2E Test · レシピとカメラ (Playwright, ${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    services:
      postgres: *postgres
    steps:
      - *checkout
      - *setup-bun
      - *install
      - name: Install the selected browser
        env:
          BROWSER: ${{ matrix.browser }}
        run: bun run --bun playwright install --with-deps --no-shell "$BROWSER"
      - name: Test Expo Web and Hono
        env:
          BROWSER: ${{ matrix.browser }}
          NURI_E2E_DATABASE_URL: postgresql://expo-hono-opentofu-starter:starter@localhost:5432/expo-hono-opentofu-starter
        run: bun run --bun test:e2e --project "$BROWSER"
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: web-e2e-traces-${{ matrix.browser }}
          path: .artifacts/playwright
          if-no-files-found: ignore
          retention-days: 7

  mobile-export:
    name: Build · Expo iOS と Android のバンドル
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup-bun
      - *install
      - name: Check Expo dependencies
        run: bun run --bun doctor
      - name: Export the native bundles
        run: bun run --bun --cwd apps/mobile expo export --platform ios --platform android
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: mobile-bundles
          path: apps/mobile/dist
          retention-days: 7

  quality:
    needs:
      [
        static-analysis,
        unit,
        mobile-unit,
        api-integration,
        web-e2e,
        mobile-export,
        infrastructure,
        container,
      ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: 1.13.8
      - uses: terraform-linters/setup-tflint@v6.3.2
        with:
          tflint_version: v0.65.0
      - run: tofu fmt -check -recursive infra
      - run: tofu -chdir=infra init -backend=false -lockfile=readonly
      - run: tofu -chdir=infra validate
      - run: tofu -chdir=infra/bootstrap init -backend=false -lockfile=readonly
      - run: tofu -chdir=infra/bootstrap validate
      - run: tofu -chdir=infra/preview init -backend=false -lockfile=readonly
      - run: tofu -chdir=infra/preview validate
      - run: tflint --init
      - run: tflint --chdir=infra --config="$GITHUB_WORKSPACE/.tflint.hcl"
      - run: tflint --chdir=infra/bootstrap --config="$GITHUB_WORKSPACE/.tflint.hcl"
      - run: tflint --chdir=infra/preview --config="$GITHUB_WORKSPACE/.tflint.hcl"
  container:
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup-bun
      - name: Validate local Compose configurations
        env:
          DEVICE_API_ORIGIN: https://api.nuri.localhost
          DEVICE_METRO_ORIGIN: https://metro.nuri.localhost
          DEVICE_EXPO_ORIGIN: exps://metro.nuri.localhost
          DEVICE_GOOGLE_ORIGIN: https://google.nuri.localhost
          DEVICE_APPLE_ORIGIN: https://apple.nuri.localhost
          DEVICE_MAIL_ORIGIN: https://mail.nuri.localhost
        run: bun .github/scripts/ci/check-compose.ts
      - run: docker build --tag expo-hono-opentofu-starter-api --file apps/api/Dockerfile .
      - name: Run Hono and Expo Web container smoke test
        run: bun .github/scripts/ci/check-container.ts
