name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: '1'
jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - &setup-bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - &install
        name: Install Workspace Dependencies
        run: bun install --frozen-lockfile
      - name: Verify Generated Uniwind Types
        run: |
          bun run --bun --cwd apps/mobile styles:generate
          git diff --exit-code -- apps/mobile/uniwind-types.d.ts
      - name: Check Fallow Dead Code and Duplication
        run: bun run --bun --parallel deadcode dupes
      - name: Check Formatting, Lint, and Types
        run: bun run --bun --parallel format:check lint typecheck
      - name: Check Commit Messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun run --bun commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  unit:
    name: Unit Tests (Bun)
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - *setup-bun
      - *install
      - name: Run Bun Unit Tests
        run: bun run --bun turbo run test test:scripts --filter='!@starter/mobile' --log-order=stream

  mobile-unit:
    name: Unit Tests (Jest, Shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - *checkout
      - *setup-bun
      - *install
      - name: Run Jest Shard
        env:
          SHARD: ${{ matrix.shard }}/2
        run: bun run --bun --cwd apps/mobile test --shard="$SHARD"

  api-integration:
    name: API Integration Tests (PostgreSQL and Floci)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://expo-hono-opentofu-starter:starter@localhost:5432/expo-hono-opentofu-starter
      GCS_BUCKET: nuri-ci
      STORAGE_EMULATOR_HOST: http://127.0.0.1:4588
    services:
      postgres: &postgres
        image: postgres:17.7-bookworm
        env:
          POSTGRES_USER: expo-hono-opentofu-starter
          POSTGRES_PASSWORD: starter
          POSTGRES_DB: expo-hono-opentofu-starter
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U expo-hono-opentofu-starter -d expo-hono-opentofu-starter"
          --health-interval 5s --health-timeout 5s --health-retries 12
      floci: &floci
        image: floci/floci-gcp:0.12.0
        ports: ['4588:4588']
    steps:
      - *checkout
      - *setup-bun
      - *install
      - name: Prepare Integration Services
        run: |
          bun run --cwd apps/api src/db/migrate.ts
          bun run --cwd apps/api storage:init
      - name: Run API Integration Tests
        run: bun run --cwd apps/api test:integration

  web-e2e:
    name: Web E2E (Chromium)
    runs-on: ubuntu-latest
    services:
      postgres: *postgres
      floci: *floci
    steps:
      - *checkout
      - *setup-bun
      - *install
      - name: Install Chromium
        run: bun run --bun playwright install --with-deps --no-shell chromium
      - name: Run Web E2E
        env:
          NURI_E2E_DATABASE_URL: postgresql://expo-hono-opentofu-starter:starter@localhost:5432/expo-hono-opentofu-starter
        run: bun run --bun test:e2e
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: web-e2e-traces
          path: .artifacts/playwright
          if-no-files-found: ignore
          retention-days: 7

  mobile-export:
    name: Native Bundle Build
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup-bun
      - *install
      - name: Verify Expo Dependencies
        run: bun run --bun doctor
      - name: Export iOS and Android Bundles
        run: bun run --bun --cwd apps/mobile expo export --platform ios --platform android
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: mobile-bundles
          path: apps/mobile/dist
          retention-days: 7

  native-e2e:
    name: Native E2E (Maestro Android)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - *checkout
      - *setup-bun
      - name: Run Android Smoke Test
        env:
          GH_TOKEN: ${{ github.token }}
          MAESTRO_CLI_NO_ANALYTICS: '1'
        run: bun .github/scripts/ci/android-maestro.ts
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: maestro-android-debug
          path: .artifacts/maestro
          if-no-files-found: ignore
          retention-days: 7

  all-checks:
    name: All CI Checks
    needs:
      [
        static-analysis,
        unit,
        mobile-unit,
        api-integration,
        web-e2e,
        mobile-export,
        native-e2e,
        infrastructure,
        container,
      ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require All Jobs to Pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
  infrastructure:
    name: Infrastructure Validation
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup-bun
      - name: Install Verified TFLint
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun .github/scripts/ci/prepare-tflint.ts
      - name: Install Verified OpenTofu and Provider
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun .github/scripts/ci/prepare-opentofu.ts
      - run: tofu fmt -check -recursive infra
      - run: tofu -chdir=infra init -backend=false -lockfile=readonly
      - run: tofu -chdir=infra validate
      - run: tofu -chdir=infra/bootstrap init -backend=false -lockfile=readonly
      - run: tofu -chdir=infra/bootstrap validate
      - run: tofu -chdir=infra/preview init -backend=false -lockfile=readonly
      - run: tofu -chdir=infra/preview validate
      - run: tofu -chdir=infra/preview-pr init -backend=false -lockfile=readonly
      - run: tofu -chdir=infra/preview-pr validate
      - run: tflint --init
      - run: tflint --chdir=infra --config="$GITHUB_WORKSPACE/.tflint.hcl"
      - run: tflint --chdir=infra/bootstrap --config="$GITHUB_WORKSPACE/.tflint.hcl"
      - run: tflint --chdir=infra/preview --config="$GITHUB_WORKSPACE/.tflint.hcl"
      - run: tflint --chdir=infra/preview-pr --config="$GITHUB_WORKSPACE/.tflint.hcl"
  container:
    name: Container Smoke Test
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup-bun
      - name: Validate Compose Configurations
        env:
          DEVICE_API_ORIGIN: https://api.nuri.localhost
          DEVICE_METRO_ORIGIN: https://metro.nuri.localhost
          DEVICE_EXPO_ORIGIN: exps://metro.nuri.localhost
          DEVICE_GOOGLE_ORIGIN: https://google.nuri.localhost
          DEVICE_MAIL_ORIGIN: https://mail.nuri.localhost
        run: |
          sh scripts/worktree-init.sh
          docker compose config --quiet
          docker compose --profile editor --profile tunnel config --quiet
          docker compose -f compose.yaml -f compose.go.yaml config --quiet
          docker compose -f compose.yaml -f compose.devices.yaml config --quiet
      - run: docker build --tag expo-hono-opentofu-starter-api --file apps/api/Dockerfile .
      - name: Run Container Smoke Test
        run: bun .github/scripts/ci/check-container.ts
