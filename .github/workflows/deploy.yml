name: Deploy API, Expo Web and mobile update
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-deployment
  queue: max
jobs:
  deploy:
    if: >-
      vars.GCP_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}
      MIGRATION_JOB: ${{ vars.CLOUD_RUN_MIGRATION_JOB }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Check deployment configuration and current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun .github/scripts/deploy/staging.ts check
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3.0.1
      - name: Resolve the staging API and Web image
        id: image
        run: bun .github/scripts/deploy/staging.ts image
      - name: Migrate before deploying
        if: steps.image.outputs.skip != 'true'
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: bun .github/scripts/deploy/staging.ts migrate
      - name: Deploy candidate without traffic and check API and Web
        if: steps.image.outputs.skip != 'true'
        id: candidate
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: bun .github/scripts/deploy/staging.ts candidate
      - name: Promote tested revision
        if: steps.image.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ steps.candidate.outputs.revision }}
        run: bun .github/scripts/deploy/staging.ts promote
      - if: vars.EXPO_UPDATE_ENABLED == 'true' && steps.image.outputs.skip != 'true'
        run: bun install --frozen-lockfile
      - name: Publish matching production update through Expo Workflows
        if: vars.EXPO_UPDATE_ENABLED == 'true' && steps.image.outputs.skip != 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bunx --bun eas workflow:run .eas/workflows/production-update.yml --ref "$TARGET_SHA" --non-interactive --wait
