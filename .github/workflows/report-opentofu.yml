name: Report OpenTofu operation
on:
  workflow_call:
    inputs:
      pr:
        type: string
        required: true
      target:
        type: string
        required: true
      operation:
        type: string
        required: true
      result:
        type: string
        required: true
      log:
        type: string
        required: false
permissions:
  contents: read
  pull-requests: write
jobs:
  comment:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Post the OpenTofu result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
          TARGET: ${{ inputs.target }}
          OPERATION: ${{ inputs.operation }}
          RESULT: ${{ inputs.result }}
          OPERATION_LOG: ${{ inputs.log }}
        run: bun .github/scripts/opentofu/report.ts
