name: Report OpenTofu apply
on:
  workflow_call:
    inputs:
      pr:
        type: string
        required: true
      target:
        type: string
        required: true
      result:
        type: string
        required: true
permissions:
  pull-requests: write
jobs:
  comment:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v9.0.0
        env:
          PR_NUMBER: ${{ inputs.pr }}
          TARGET: ${{ inputs.target }}
          RESULT: ${{ inputs.result }}
        with:
          script: |
            if (!/^[1-9]\d{0,8}$/.test(process.env.PR_NUMBER)) throw new Error('Invalid PR number');
            if (!['nuri-staging', 'nuri-preview'].includes(process.env.TARGET)) throw new Error('Invalid target');
            const number = Number(process.env.PR_NUMBER);
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            if (!pr.merged || pr.base.ref !== 'main') throw new Error('Apply results require a PR merged into main');
            const result = process.env.RESULT === 'success'
              ? '✅ 適用完了'
              : process.env.RESULT === 'cancelled'
                ? '⏹️ 実行中止'
                : '❌ ワークフロー失敗';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: number,
              body: `### OpenTofu apply · \`${process.env.TARGET}\`\n\n${result}\n\nSHA \`${context.sha}\` · [Actions 実行ログ](${runUrl})`,
            });
