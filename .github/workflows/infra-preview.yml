name: Preview Infrastructure
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan only, or apply to the isolated PR preview resources
        type: choice
        options: [plan, apply]
        default: plan
      pr:
        description: Merged PR number to receive the apply result
        type: string
permissions:
  contents: read
concurrency:
  group: nuri-preview-cloud
  queue: max
jobs:
  opentofu:
    name: Run OpenTofu
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      log: ${{ steps.operation.outputs.log }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # 現在のmainと対象PRを確認してからクラウドへ認証する。
      - name: Verify Current Main and CI
        env:
          OPERATION: ${{ inputs.operation }}
          PR_NUMBER: ${{ inputs.pr }}
          GH_TOKEN: ${{ github.token }}
        run: bun .github/scripts/opentofu/verify.ts preview
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PREVIEW_INFRA_WIF_PROVIDER }}
          service_account: ${{ vars.PREVIEW_INFRA_SERVICE_ACCOUNT }}
      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: 1.13.8
          tofu_wrapper: false
      - name: Plan or Apply Preview Infrastructure
        id: operation
        env:
          OPERATION: ${{ inputs.operation }}
        run: bun .github/scripts/opentofu/manage.ts preview
  report:
    needs: opentofu
    if: always() && github.ref == 'refs/heads/main' && inputs.operation == 'apply' && inputs.pr != ''
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/report-opentofu.yml
    with:
      pr: ${{ inputs.pr }}
      target: nuri-preview
      operation: ${{ inputs.operation }}
      result: ${{ needs.opentofu.result }}
      log: ${{ needs.opentofu.outputs.log }}
