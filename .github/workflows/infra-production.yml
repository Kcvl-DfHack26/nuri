name: Manage production infrastructure
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan only, or apply to kcvlb4 / nuri-staging
        type: choice
        options: [plan, apply]
        default: plan
      pr:
        description: Merged PR number to receive the apply result
        type: string
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  opentofu:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      log: ${{ steps.operation.outputs.log }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      TOFU_PROVIDER: ${{ vars.TOFU_WORKLOAD_IDENTITY_PROVIDER }}
      TOFU_ACCOUNT: ${{ vars.TOFU_SERVICE_ACCOUNT }}
      TOFU_VARIABLES: ${{ vars.TOFU_VARIABLES_JSON }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify the production target and main CI
        env:
          OPERATION: ${{ inputs.operation }}
          PR_NUMBER: ${{ inputs.pr }}
          GH_TOKEN: ${{ github.token }}
          DEPLOY_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          DEPLOY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          if [[ "$OPERATION" == apply ]]; then
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]] || { echo 'Enter the merged PR number for apply'; exit 1; }
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.merged and (.base.ref == "main")' | grep -Fx true
          fi
          test "$PROJECT_ID/$REGION/$SERVICE" = 'kcvlb4/asia-northeast1/nuri-staging'
          : "${TOFU_PROVIDER:?Set TOFU_WORKLOAD_IDENTITY_PROVIDER}" "${TOFU_ACCOUNT:?Set TOFU_SERVICE_ACCOUNT}"
          test "$TOFU_PROVIDER" != "$DEPLOY_PROVIDER"
          test "$TOFU_ACCOUNT" != "$DEPLOY_ACCOUNT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq '[.workflow_runs[] | select(.event == "push")] | length')
          test "$passed" -gt 0 || { echo 'This SHA has not passed the main CI workflow'; exit 1; }
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.TOFU_PROVIDER }}
          service_account: ${{ env.TOFU_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3.0.1
      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: 1.13.8
          tofu_wrapper: false
      - name: Plan and optionally apply
        id: operation
        working-directory: infra
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          umask 077
          vars_file="$RUNNER_TEMP/nuri-production.tfvars.json"
          plan_file="$RUNNER_TEMP/nuri-production.tfplan"
          jq -e --arg project "$PROJECT_ID" --arg region "$REGION" --arg service "$SERVICE" \
            --arg repo "$GITHUB_REPOSITORY" --arg repo_id "$GITHUB_REPOSITORY_ID" '
              select(type == "object" and .deploy_application == true and .deletion_protection == true
                and (has("database_password") | not))
              + {project_id: $project, region: $region, name: $service,
                 github_repository: $repo, github_repository_id: $repo_id}
            ' <<< "$TOFU_VARIABLES" > "$vars_file"
          tofu init -input=false -lockfile=readonly \
            -backend-config="bucket=$PROJECT_ID-tofu-state" -backend-config='prefix=nuri/staging'
          test "$(tofu state list 'google_cloud_run_v2_service.api[0]')" = 'google_cloud_run_v2_service.api[0]'
          password=$(gcloud secrets versions access latest --project="$PROJECT_ID" --secret="$SERVICE-database-url" |
            python3 -c 'import sys; from urllib.parse import unquote, urlsplit; print(unquote(urlsplit(sys.stdin.read().strip()).password or ""))')
          test "${#password}" -ge 24
          printf '::add-mask::%s\n' "$password"
          export TF_VAR_database_password="$password"
          tofu plan -input=false -no-color -lock-timeout=5m -var-file="$vars_file" -out="$plan_file"
          if [[ "$OPERATION" == apply ]]; then
            tofu show -json "$plan_file" | jq -e 'all(.resource_changes[]?; .change.actions | index("delete") | not)' >/dev/null || {
              echo 'The plan contains a deletion or replacement. Review it in a separate infrastructure change.'
              exit 1
            }
            bash ../scripts/run-opentofu.sh apply -input=false -no-color -lock-timeout=5m "$plan_file"
          fi
  report:
    needs: opentofu
    if: always() && github.ref == 'refs/heads/main' && inputs.operation == 'apply' && inputs.pr != ''
    permissions:
      pull-requests: write
    uses: ./.github/workflows/report-opentofu.yml
    with:
      pr: ${{ inputs.pr }}
      target: nuri-staging
      operation: ${{ inputs.operation }}
      result: ${{ needs.opentofu.result }}
      log: ${{ needs.opentofu.outputs.log }}
